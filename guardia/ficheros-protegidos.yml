# Segunda puerta: va en .github/workflows/ del proyecto y corre en GitHub,
# fuera de la máquina del agente. Quien ejecuta no verifica.
# Si un PR toca tests/ o .github/, falla salvo que una persona añada la
# etiqueta `cambio-de-especificacion`. (En local: uv run check, misma regla.)
# Hueco conocido: un PR puede modificar este workflow; en un repo real, añadid
# protección de rama y CODEOWNERS sobre .github/.
name: Ficheros protegidos

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  comprobar:
    if: ${{ !contains(github.event.pull_request.labels.*.name, 'cambio-de-especificacion') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Comprobar ficheros protegidos
        run: |
          if git diff --name-only "origin/${{ github.base_ref }}...HEAD" | grep -E '^(tests/|\.github/)'; then
            echo "::error::Este PR modifica ficheros protegidos. Si es intencionado, una persona debe añadir la etiqueta cambio-de-especificacion."
            exit 1
          fi
