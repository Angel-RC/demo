# Quien ejecuta no verifica: esto corre fuera de la máquina del agente.
# Si un PR toca tests/, .github/, scripts/ o la configuración de pytest, falla
# salvo que una persona añada la etiqueta `cambio-de-especificacion`.
# El check se ejecuta desde la rama base: un PR no puede debilitar su propio guardia.
name: Ficheros protegidos

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Comprobar ficheros protegidos
        env:
          ETIQUETAS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
        run: |
          git show origin/${{ github.base_ref }}:scripts/check_protegidos.py > "$RUNNER_TEMP/check_protegidos.py"
          python "$RUNNER_TEMP/check_protegidos.py" --base origin/${{ github.base_ref }}

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: pytest -q && pytest tests_hook -q
