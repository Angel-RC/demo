# Quien ejecuta no verifica: esto corre fuera de la máquina del agente.
# Si un PR toca tests/ o .github/, falla salvo que una persona añada la
# etiqueta `cambio-de-especificacion`.
# Hueco conocido: un PR puede modificar este check; en un repo real, añadid
# protección de rama y CODEOWNERS sobre .github/ y demo/.
name: Ficheros protegidos

on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]

jobs:
  comprobar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - name: Comprobar ficheros protegidos
        if: ${{ !contains(github.event.pull_request.labels.*.name, 'cambio-de-especificacion') }}
        run: uv run check origin/${{ github.base_ref }}...HEAD

  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - run: uv run pytest -q
      - run: uv run pytest tests_hook -q
